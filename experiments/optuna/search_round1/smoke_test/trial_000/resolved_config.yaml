data:
  metadata_path: data/processed/processed_metadata.csv
  image_root: images
  stats_path: data/processed/stats.json
split:
  val_ratio: 0.1
  seed: 42
image:
  size: 64
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
augmentation:
  horizontal_flip_p: 0.5
  rotate_limit: 15
  rotate_p: 0.5
  brightness_contrast_p: 0.3
dataloader:
  batch_size: 64
  num_workers: 0
  shuffle:
    train: true
    valid: false
    test: false
labels:
  order:
  - Tg
  - Density
  - FFV
  - Tc
  - Rg
model:
  name: resnet18
  pretrained: true
  dropout: 0.2
loss:
  name: mse
  huber_delta: 1.0
scheduler:
  name: cosine
  t_max: 1
  eta_min: 1.0e-06
training:
  epochs: 1
  learning_rate: 5.6115164153345e-05
  weight_decay: 0.006351221010640704
  grad_clip_norm: 1.0
  amp: false
  early_stopping:
    patience: 5
    min_delta: 0.0001
  checkpoint_dir: experiments\optuna\search_round1\smoke_test\trial_000\checkpoints
  log_dir: experiments\optuna\search_round1\smoke_test\trial_000\logs
  seed: 42
output:
  learning_curve_path: reports/learning_curve.png
  predictions_path: reports/predictions.csv
